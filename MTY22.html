<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>شوینده‌ها</title>
  <style>
    :root { --gap: 18px; }
    body {
      font-family: Vazir, Tahoma, sans-serif;
      margin: 0;
      background: #f6f7fb;
      color: #111;
    }
    .container {
      max-width: 980px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 18px;
    }
    .grid {
      display: flex;
      gap: var(--gap);
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(16,24,40,.06);
      overflow: hidden;
      max-width: 300px;
      flex: 1 1 260px;
      text-align: center;
    }
    .card a {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .caption {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f4;
      font-weight: 600;
    }
    footer {
      margin-top: 28px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    @media (max-width: 520px) {
      .card img { height: 160px; }
    }

    /* استایل دکمه بازگشت به صفحه اصلی */
    .back-btn {
      display: inline-block;
      margin: 30px auto 0;
      padding: 12px 24px;
      background: #4CAF50;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
      transition: background 0.3s, transform 0.2s;
    }
    .back-btn:hover {
      background: #45a049;
      transform: translateY(-2px);
    }
    .back-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>دسته بندی‌های شوینده‌ها</h1>
    <div class="grid">
      <div class="card">
        <a href="MTY2.html">
          <img src="IMGMTY22/SHO1.jpg" alt="AKSSHOW1">
        </a>
      </div>

      <div class="card">
        <a href="MTY4.html">
          <img src="IMGMTY22/SHO2.png" alt="AKSSHOW2">
        </a>
      </div>

      <div class="card">
        <a href="MTY5.html">
          <img src="IMGMTY22/SHO3.jpg" alt="AKSSHOW3">
        </a>
      </div>

      <div class="card">
        <a href="MTY6.html">
          <img src="IMGMTY22/SHO4.jpg" alt="AKSSHOW3">
        </a>
      </div>
    </div>

    <a href="index.html" class="back-btn">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
