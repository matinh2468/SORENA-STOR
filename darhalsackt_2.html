<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت در حال ساخت 🚧</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Vazirmatn', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: repeating-linear-gradient(
        -45deg,
        #ffcc00,
        #ffcc00 20px,
        #000 20px,
        #000 40px
      );
      color: #fff;
      text-align: center;
    }

    .box {
      background: rgba(0,0,0,0.8);
      padding: 40px 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    h1 {
      font-size: 4rem;
      margin: 0 0 15px;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to   { opacity: 0.6; }
    }

    h2 {
      margin: 10px 0;
      font-size: 1.8rem;
      color: #fff;
    }

    p {
      margin: 10px 0 20px;
      font-size: 1.1rem;
      color: #ccc;
      line-height: 1.8;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      background: #ffcc00;
      color: #000;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fff200;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚧</h1>
    <h2>سایت فروشگاه میر جلیل هاشمی</h2>
    <p>در حال ساخت و بروزرسانی است.<br>
       به‌زودی با خدمات جدید برمی‌گردیم 🙏</p>
    <a href=".....html" class="btn">بازگشت به صفحه اصلی</a>
    <a href=".....html" class="btn">بازگشت به  مشاهده بیشتره کالا ها</a>
  </div>
</body>
</html>
